<!DOCTYPE html>
<html lang="en" class="login">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录/Login</title>
    <link rel="stylesheet" href="./layui/css/layui.css">
    <link rel="stylesheet" href="./css/diy.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<style>
                * {
            moz-user-select: -moz-none;
            -moz-user-select: none;
            -o-user-select: none;
            -khtml-user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background: #34495e;
        }

        .wrap {
            width: 300px;
            margin: 8px auto 8px;
        }

        .banner {
            width: 300px;
            height: 150px;
            background: url(./img/5.png) center / 300px 150px no-repeat;
            position: relative;
            overflow: hidden;
            border-radius: 6px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .12);
        }

        .blank-box {
            position: absolute;
            top: 58px;
            left: 180px;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, .72);
            border: 2px solid rgba(255, 255, 255, .95);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, .18);
        }

        .block {
            position: absolute;
            top: 58px;
            left: 0;
            width: 36px;
            height: 36px;
            background: url(./img/5.png) 0 0 / 300px 150px no-repeat;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
            box-sizing: border-box;
            z-index: 2;
        }

        .move {
            position: relative;
            height: 36px;
            margin-top: 6px;
            overflow: hidden;
            border-radius: 4px;
        }

        .move p {
            height: 36px;
            line-height: 36px;
            font-size: 16px;
            color: #666;
            background: #eee;
            text-align: center;
            margin: 0;
        }

        .move-block {
            position: absolute;
            left: 0;
            top: 0;
            width: 36px;
            height: 36px;
            background: #1abc9c;
            cursor: pointer;
            z-index: 3;
            transition: background-color .2s;
            touch-action: none;
        }

        .move-block::before {
            content: ">";
            display: block;
            line-height: 36px;
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
        }

        .move-block.is-success {
            background: #42b983;
        }
        </style>

<body>
<article class="">
        <div class="warp">
        <div class="layui-container">
            <div class="layui-row">
                <div>
                        <span>
                          <h1>房屋租赁系统</h1>
                        </span>
                </div>
                <form class="layui-form" action="">
                    <div class="layui-form-item">
                        <label class="layui-form-label">账号</label>
                        <div class="layui-input-block">
                            <input type="text" name="title" lay-verify="title" autocomplete="off"
                                   placeholder="用户名 / 手机 / 邮箱"
                                   class="layui-input" id="account">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">密码</label>
                        <div class="layui-input-block">
                            <input type="password" name="password" placeholder="请输入密码" autocomplete="off"
                                   class="layui-input"
                                   id="password">
                        </div>
                    </div>
                                            <!-- 极验开始 -->
                        <div class="wrap">
                            <div class="banner">
                                <div class="blank-box"></div>
                                <div class="block"></div>
                            </div>
                            <div class="move">
                                <p>移动滑块>>></p>
                                <div class="move-block"></div>
                            </div>
                        </div>
                        <!-- 极验结束 -->
                                                                            </form>
                <div class="layui-btn-container">
                    <a type="button" class="layui-btn layui-btn-normal" id="login">登录/Login</a>
                                            <a type="button" class="layui-btn layui-btn-normal" id="enroll">注册/Register</a>
                                        <a href="./page/forgot.html" type="button" class="layui-btn layui-btn-normal">密码找回/Retrieve
                        password</a>
                </div>
            </div>
        </div>
    </div>
</article>
</body>
<script src="./layui/layui.js" charset="utf-8"></script>
        <script src="./js/login.js"></script>
    <script src="./js/base.js"></script>

    let btn = document.getElementById("login");
    let account = document.getElementById("account");
    let password = document.getElementById("password");

    // 登录/Login
    let info

            layer.msg('请输入账号');

            info = res.result;

                account.value = ''
                password.value = ''
            }
        }
    }

    async function keyboard(event) {
        let keycode = event.keyCode;
        if (keycode == 13) {
            const {data: res} = await axios.post(BaseUrl + '/api/user/login?', {
                username: account.value,
                password: password.value
            })
            info = res.result;
            if (info != undefined) {
                let obj = res.result.obj;
                sessionStorage.setItem('personInfo', [obj])
                sessionStorage.setItem('token', res.result.obj.token)
                window.location.replace("./page/frime.html");
            } else if (res.error.message) {
                layer.msg(res.error.message);
                account.value = ''
                password.value = ''
            }
        }
    }

    //参数1：表示事件，keydown:键盘向下按；参数2：表示触发的事件处理函数
    document.addEventListener("keydown", keyboard);

    // 注册/Register
                enroll.onclick = function () {
            window.location.replace("./page/register.html");
        }
        
    // 弹出层
    layui.use('layer', function () {

    if (personInfo) {

</script>

</html>
