    var BaseUrl = baseUrl()
    let personInfo = JSON.parse(sessionStorage.personInfo)

    // 请求数据

    async function get_list() {
        let {data: ren} = await axios.get(BaseUrl + '/api/auth/get_list', {
            params: {
                user_group: personInfo.user_group
            }
        })
        permissions = ren.result.list


    function $get_power(path) {
        var list = permissions;
        var obj;
        for (var i = 0; i < list.length; i++) {
            var o = list[i];
            if (o.path === path) {
                obj = o;
                break;
            }
        }
        return obj;
    }

    /**
     * 是否有统计字段的权限
     */
    function $check_figure(path) {
        var o = $get_power(path);
        if (o) {
            var option = JSON.parse(o.option);
            if (option.figure)
                return true
        }
        return false;
    }

    function $check_comment(path) {
        var o = this.$get_power(path);
        if (o) {
            var option = JSON.parse(o.option);
            if (option.can_show_comment)
                return true
        }
        return false;
    }

                                                                            let house_information = document.querySelector('#house_information')

                if (personInfo.user_group === '管理员' || $check_figure('/house_information/table')) {

                } else {

                                                                                                            let payment_information = document.querySelector('#payment_information')

    async function echartsFun(id, url, title) {

        // 基于准备好的dom，初始化echarts实例
        var myChart = echarts.init(document.getElementById(id));

        let user_group = personInfo.user_group
        let user_id = personInfo.user_id

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (user_group != '管理员') {
                                                                    let sqlwhere = "(";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (user_group == "出租用户") {
                                                sqlwhere += "rental_user = " + user_id + " or ";
                                            }
                                                                                                                                                                                                                                            if (user_group == "承租用户") {
                                                sqlwhere += "tenant_user = " + user_id + " or ";
                                            }
                                                                                                                                                                                                                                                                        if (sqlwhere.length > 1) {
                                        sqlwhere = sqlwhere.substr(0, sqlwhere.length - 4);
                                        sqlwhere += ")";
                                        url += "&sqlwhere=" + sqlwhere
                                    }
                                                            }
                                                                                                                                                    
        let {data: res} = await axios.get(url)

        let arr = []

        arr = res.result.list.map((o) => {
            return {
                name: o[1],
                value: o[0]
            };
        });
        // 指定图表的配置项和数据
        var option = {
            title: {
                text: title,
                left: 'center'
            },
            tooltip: {
                trigger: 'item'
            },
            legend: {
                orient: 'vertical',
                left: 'left'
            },
            series: [
                {
                    name: '参数',
                    type: 'pie',
                    radius: '50%',
                    data: arr,
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 10,
                            shadowOffsetX: 0,
                            shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                    }
                }
            ]
        };

        // 使用刚指定的配置项和数据显示图表。
        myChart.setOption(option);
    }
